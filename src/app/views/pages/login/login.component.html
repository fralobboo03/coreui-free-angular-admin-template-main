<div class="bg-light dark:bg-transparent d-flex flex-row align-items-center" style="margin-top: 13%;">
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col lg="10" xl="8">
        <c-card-group>
          <c-card class="p-4">
            <c-card-body>
              <form cForm [formGroup]="formGroup">
                <h1>Login</h1>
                <p class="text-body-secondary">Sign In to your account</p>
                <c-input-group class="mb-3">
                  <span cInputGroupText [ngClass]="{'input-validate': formGroup.get('username')?.invalid && formGroup.get('username')?.touched}">
                    <svg cIcon name="cilUser"></svg>
                  </span>
                  <input autoComplete="username" cFormControl formControlName="username" placeholder="Username" [ngClass]="{'input-validate': formGroup.get('username')?.invalid && formGroup.get('username')?.touched}"/>
                </c-input-group>
                <p *ngIf="formGroup.get('username')?.invalid && formGroup.get('username')?.touched && formGroup.get('username')?.errors?.['required']" class="validate">
                  Please enter your username
                </p>
                <c-input-group class="mb-4">
                  <span cInputGroupText [ngClass]="{'input-validate': formGroup.get('password')?.invalid && formGroup.get('password')?.touched}">
                    <svg cIcon name="cilLockLocked"></svg>
                  </span>
                  <input
                    autoComplete="current-password"
                    cFormControl
                    placeholder="Password"
                    formControlName="password"
                    type="password"
                    [ngClass]="{'input-validate': formGroup.get('password')?.invalid && formGroup.get('password')?.touched}"
                  />
                </c-input-group>
                <p *ngIf="formGroup.get('password')?.invalid && formGroup.get('password')?.touched && formGroup.get('password')?.errors?.['required']" class="validate">
                  Please enter your password
                </p>
                <c-row>
                  <c-col xs="6">
                    <button [routerLinkActive]="'active'" cButton class="px-4" color="primary" (click)="login()">
                      Login
                    </button>
                  </c-col>
                  <c-col class="text-right" xs="6">
                    <!-- <button cButton class="px-0" color="link">
                      Forgot password?
                    </button> -->
                  </c-col>
                </c-row>
              </form>
            </c-card-body>
          </c-card>
          <!-- <c-card [ngStyle]="{'minWidth.%': 44}" class="text-white bg-primary py-5">
            <c-card-body class="text-center">
              <div>
                <h2>Sign up</h2>
                <p>
                  Lorem ipsum dolor sit amet, consectetur adipisicing elit, sed do eiusmod
                  tempor incididunt ut labore et dolore magna aliqua.
                </p>
                <button [active]="true" cButton class="mt-3" color="primary" routerLink="/register">
                  Register Now!
                </button>
              </div>
            </c-card-body>
          </c-card> -->
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
<div class="d-flex justify-content-center">
  <button [routerLinkActive]="'active'" cButton class="px-4 mt-4 btn-black" color="secondary" (click)="home()">
    Home
  </button>
</div>
